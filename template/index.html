<!DOCTYPE html>
<html>
<head>
<title>AI Traffic Cop - Bangalore Police Dashboard</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center}
.header{background:#dc2626;padding:20px;font-size:24px;font-weight:bold}
.container{display:flex;justify-content:center;gap:20px;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px}
#video{border:4px solid #22c55e;border-radius:10px}
.count{font-size:50px;color:#facc15}
</style>
</head>
<body>
<div class="header">🚦 BANGALORE POLICE - AI TRAFFIC COP CONTROL ROOM</div>
<div class="container">
<div class="card">
<h2>Live Signal Feed - MG Road</h2>
<img id="video" src="/video_feed" width="700">
</div>
<div class="card">
<h3>Violations Today</h3>
<div class="count" id="count">0</div>
<p>E-Challans Generated</p>
<h3>Status: <span style="color:#22c55e">● LIVE (30 FPS)</span></h3>
<p>Stop Line: Active</p>
<p>Auto Proof: Enabled</p>
</div>
</div>
<script>
setInterval(()=>{fetch('/count').then(r=>r.json()).then(d=>document.getElementById('count').innerText=d.violations)},1000)
</script>
</body>
</html>
