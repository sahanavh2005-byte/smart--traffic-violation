<!DOCTYPE html>
<html>
<head><title>AI Traffic Cop</title>
<style>body{font-family:Arial;background:#0f172a;color:white;text-align:center}.header{background:#dc2626;padding:20px;font-size:22px}.card{background:#1e293b;padding:15px;border-radius:10px;margin:20px}#video{border:4px solid #22c55e;border-radius:10px}.count{font-size:40px;color:#facc15}</style>
</head>
<body>
<div class="header">BANGALORE POLICE - AI TRAFFIC COP</div>
<div class="card">
<h2>Live MG Road Feed</h2>
<img id="video" src="/video_feed" width="700">
<h3>Violations: <span class="count" id="count">0</span></h3>
</div>
<script>setInterval(()=>{fetch('/count').then(r=>r.json()).then(d=>document.getElementById('count').innerText=d.violations)},1000)</script>
</body>
</html>
